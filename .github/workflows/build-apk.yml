name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pubspec.yaml and place main.dart in lib/
        run: |
          mkdir -p lib && cp main.dart lib/main.dart
          cat > pubspec.yaml <<'YAML'
          name: a2r_academy_sender
          description: A2R Academy Sender
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            path: ^1.9.0
            path_provider: ^2.1.3
            file_picker: ^8.0.7
            permission_handler: ^11.3.1
            excel: 4.0.3
          dependency_overrides:
            archive: ^3.6.1
            flutter_plugin_android_lifecycle: 2.0.24
          flutter:
            uses-material-design: true
          YAML
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android + native WhatsApp Business share
        run: |
          flutter create --platforms=android --org com.a2r --project-name a2r_academy_sender /tmp/gen
          cp -r /tmp/gen/android android
          D=android/app/src/main/kotlin/com/a2r/a2r_academy_sender
          mkdir -p $D android/app/src/main/res/xml
          rm -f $D/*
          cat > $D/MainActivity.kt <<'KT'
          package com.a2r.a2r_academy_sender

          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.net.Uri
          import android.provider.Settings
          import androidx.core.content.FileProvider
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          class MainActivity : FlutterActivity() {
              private val businessPkg = "com.whatsapp.w4b"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "a2r/share")
                      .setMethodCallHandler { call, result ->
                          try {
                              when (call.method) {
                                  "share" -> {
                                      val text = call.argument<String>("text") ?: ""
                                      val paths = call.argument<List<String>>("paths") ?: emptyList()
                                      share(text, paths)
                                      result.success(true)
                                  }
                                  "accEnabled" -> result.success(WaScanService.instance != null)
                                  "openAccSettings" -> {
                                      val i = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                      startActivity(i)
                                      result.success(true)
                                  }
                                  "startScan" -> {
                                      val svc = WaScanService.instance
                                      if (svc == null) {
                                          result.error("NO_SERVICE", "الخدمة غير مفعلة", null)
                                      } else {
                                          val screen = call.argument<Boolean>("screen") ?: false
                                          WaScan.reset()
                                          WaScan.active = true
                                          if (screen) openWa() else share(".", emptyList())
                                          svc.begin()
                                          result.success(true)
                                      }
                                  }
                                  "scanStatus" -> result.success(
                                      hashMapOf<String, Any>(
                                          "active" to WaScan.active,
                                          "done" to WaScan.done,
                                          "count" to WaScan.size(),
                                          "fallback" to WaScan.usedFallback
                                      )
                                  )
                                  "scanNames" -> result.success(WaScan.snapshot())
                                  "stopScan" -> {
                                      WaScan.active = false
                                      result.success(true)
                                  }
                                  else -> result.notImplemented()
                              }
                          } catch (e: ActivityNotFoundException) {
                              result.error("NO_WA_BUSINESS", "WhatsApp Business غير مثبت", null)
                          } catch (e: Exception) {
                              result.error("SHARE_FAILED", e.message, null)
                          }
                      }
              }

              private fun openWa() {
                  val i = packageManager.getLaunchIntentForPackage(businessPkg)
                      ?: throw ActivityNotFoundException()
                  startActivity(i)
              }

              private fun mimeOf(path: String): String {
                  val p = path.lowercase()
                  return when {
                      p.endsWith(".webp") -> "image/webp"
                      p.endsWith(".png") -> "image/png"
                      p.endsWith(".gif") -> "image/gif"
                      else -> "image/jpeg"
                  }
              }

              private fun share(text: String, paths: List<String>) {
                  val uris = ArrayList<Uri>()
                  for (p in paths) {
                      uris.add(FileProvider.getUriForFile(this, "$packageName.fileprovider", File(p)))
                  }
                  val intent = Intent()
                  intent.setPackage(businessPkg)
                  when {
                      uris.isEmpty() -> {
                          intent.action = Intent.ACTION_SEND
                          intent.type = "text/plain"
                          intent.putExtra(Intent.EXTRA_TEXT, text)
                      }
                      uris.size == 1 -> {
                          intent.action = Intent.ACTION_SEND
                          intent.type = mimeOf(paths[0])
                          intent.putExtra(Intent.EXTRA_STREAM, uris[0])
                          if (text.isNotEmpty()) intent.putExtra(Intent.EXTRA_TEXT, text)
                      }
                      else -> {
                          intent.action = Intent.ACTION_SEND_MULTIPLE
                          intent.type = "image/*"
                          intent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris)
                          if (text.isNotEmpty()) intent.putExtra(Intent.EXTRA_TEXT, text)
                      }
                  }
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  for (u in uris) grantUriPermission(businessPkg, u, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  startActivity(intent)
              }
          }
          KT
          cat > $D/WaScanService.kt <<'KT'
          package com.a2r.a2r_academy_sender

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.graphics.Rect
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          object WaScan {
              @Volatile var active = false
              @Volatile var done = false
              @Volatile var usedFallback = false
              private val names = LinkedHashSet<String>()

              fun reset() {
                  synchronized(names) { names.clear() }
                  active = false
                  done = false
                  usedFallback = false
              }

              fun add(list: List<String>) {
                  synchronized(names) { names.addAll(list) }
              }

              fun size(): Int = synchronized(names) { names.size }

              fun snapshot(): ArrayList<String> = synchronized(names) { ArrayList(names) }
          }

          class WaScanService : AccessibilityService() {
              companion object {
                  @Volatile var instance: WaScanService? = null
              }

              private val pkg = "com.whatsapp.w4b"
              private val handler = Handler(Looper.getMainLooper())
              private var stale = 0
              private var away = 0
              private var ticking = false
              private var phaseUp = true
              private var upCount = 0

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              fun begin() {
                  stale = 0
                  away = 0
                  phaseUp = true
                  upCount = 0
                  if (!ticking) {
                      ticking = true
                      handler.postDelayed({ step() }, 1500)
                  }
              }

              private fun walk(n: AccessibilityNodeInfo?, out: MutableList<Pair<String, String>>) {
                  if (n == null) return
                  val t = n.text?.toString()?.trim()
                  if (!t.isNullOrEmpty()) out.add((n.viewIdResourceName ?: "") to t)
                  for (i in 0 until n.childCount) walk(n.getChild(i), out)
              }

              private fun scrollables(n: AccessibilityNodeInfo?, out: MutableList<AccessibilityNodeInfo>) {
                  if (n == null) return
                  if (n.isScrollable) out.add(n)
                  for (i in 0 until n.childCount) scrollables(n.getChild(i), out)
              }

              // أطول عنصر قابل للتمرير = قائمة المحادثات (وليس شريط الفلاتر الأفقي)
              private fun findScrollable(root: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  val l = ArrayList<AccessibilityNodeInfo>()
                  scrollables(root, l)
                  var best: AccessibilityNodeInfo? = null
                  var bh = -1
                  val r = Rect()
                  for (n in l) {
                      n.getBoundsInScreen(r)
                      if (r.height() > bh) {
                          bh = r.height()
                          best = n
                      }
                  }
                  return best
              }

              private fun step() {
                  if (!WaScan.active) {
                      ticking = false
                      return
                  }
                  val root = rootInActiveWindow
                  if (root == null || root.packageName?.toString() != pkg) {
                      away++
                      if (away > 25) {
                          finish()
                          return
                      }
                      handler.postDelayed({ step() }, 700)
                      return
                  }
                  away = 0
                  if (phaseUp) {
                      val sc = findScrollable(root)
                      if (sc != null && upCount < 40 &&
                          sc.performAction(AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD)
                      ) {
                          upCount++
                          handler.postDelayed({ step() }, 350)
                          return
                      }
                      phaseUp = false
                  }
                  val before = WaScan.size()
                  val all = ArrayList<Pair<String, String>>()
                  walk(root, all)
                  val byId = all.filter {
                      it.first.endsWith("row_name") || it.first.endsWith("contact_name")
                  }
                  val picked = if (byId.isNotEmpty()) {
                      byId
                  } else {
                      WaScan.usedFallback = true
                      all.filter { it.second.length in 2..80 }
                  }
                  WaScan.add(picked.map { it.second })
                  val scroller = findScrollable(root)
                  val scrolled = scroller?.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD) ?: false
                  if (WaScan.size() == before) stale++ else stale = 0
                  if (stale >= 3 || (scroller != null && !scrolled)) {
                      finish()
                      return
                  }
                  handler.postDelayed({ step() }, 900)
              }

              private fun finish() {
                  WaScan.active = false
                  WaScan.done = true
                  ticking = false
                  try {
                      val i = packageManager.getLaunchIntentForPackage(packageName)
                      if (i != null) {
                          i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_REORDER_TO_FRONT)
                          startActivity(i)
                      }
                  } catch (_: Exception) {
                  }
              }
          }
          KT
          cat > android/app/src/main/res/xml/a2r_accessibility.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="200"
              android:packageNames="com.whatsapp.w4b"
              android:description="@string/a2r_acc_desc" />
          XML
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/a2r_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="a2r_acc_desc">يقرأ أسماء المحادثات والجروبات من WhatsApp Business فقط لمطابقتها مع ملف Excel. لا يرسل أي بيانات خارج الهاتف.</string>
          </resources>
          XML
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <files-path name="media" path="media/" />
          </paths>
          XML
          python3 - <<'PY'
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f, encoding='utf-8').read()
          perms = (
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n'
              '    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n'
              '    <queries><package android:name="com.whatsapp.w4b"/></queries>\n'
          )
          provider = (
              '        <provider android:name="androidx.core.content.FileProvider"\n'
              '            android:authorities="${applicationId}.fileprovider"\n'
              '            android:exported="false" android:grantUriPermissions="true">\n'
              '            <meta-data android:name="android.support.FILE_PROVIDER_PATHS"\n'
              '                android:resource="@xml/file_paths"/>\n'
              '        </provider>\n'
              '        <service android:name=".WaScanService" android:exported="true"\n'
              '            android:label="A2R Sender"\n'
              '            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.accessibilityservice.AccessibilityService"/>\n'
              '            </intent-filter>\n'
              '            <meta-data android:name="android.accessibilityservice"\n'
              '                android:resource="@xml/a2r_accessibility"/>\n'
              '        </service>\n'
          )
          s = s.replace('<application', perms + '    <application android:requestLegacyExternalStorage="true"', 1)
          s = s.replace('</application>', provider + '    </application>', 1)
          s = s.replace('android:label="a2r_academy_sender"', 'android:label="A2R Sender"')
          open(f, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get
      - run: flutter build apk --release
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: A2R-Sender-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Publish release with the APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "A2R-Sender-$TAG.apk"
          gh release create "$TAG" "A2R-Sender-$TAG.apk" \
            --target "${{ github.sha }}" \
            --title "A2R Sender #${{ github.run_number }}" \
            --notes "APK build #${{ github.run_number }}"

      - name: Keep only the latest 5 releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r t; do
            gh release delete "$t" --cleanup-tag --yes
          done
