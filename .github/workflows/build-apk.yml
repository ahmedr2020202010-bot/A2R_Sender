name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create pubspec.yaml and place main.dart in lib/
        run: |
          mkdir -p lib && cp main.dart lib/main.dart
          cat > pubspec.yaml <<'YAML'
          name: a2r_academy_sender
          description: A2R Academy Sender
          publish_to: none
          version: 1.0.0+1
          environment:
            sdk: ">=3.0.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            path: ^1.9.0
            path_provider: ^2.1.3
            file_picker: ^8.0.7
            excel: 4.0.3
            archive: ^3.6.1
            image_picker: ^1.1.2
          dependency_overrides:
            archive: ^3.6.1
            flutter_plugin_android_lifecycle: 2.0.24
          flutter:
            uses-material-design: true
          YAML
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate android + native WhatsApp Business share + floating bubble service
        run: |
          flutter create --platforms=android --org com.a2r --project-name a2r_academy_sender /tmp/gen
          cp -r /tmp/gen/android android
          D=android/app/src/main/kotlin/com/a2r/a2r_academy_sender
          mkdir -p $D android/app/src/main/res/xml
          rm -f $D/*
          cat > $D/MainActivity.kt <<'KT'
          package com.a2r.a2r_academy_sender

          import android.content.ActivityNotFoundException
          import android.Manifest
          import android.content.ComponentName
          import android.content.pm.PackageManager
          import android.os.Environment
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {

              private fun a11yEnabled(): Boolean {
                  val s = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val me = ComponentName(this, BubbleService::class.java)
                  for (x in s.split(':')) {
                      val c = ComponentName.unflattenFromString(x)
                      if (c != null && c == me) return true
                  }
                  return false
              }

              private fun canOverlay(): Boolean =
                  if (Build.VERSION.SDK_INT >= 23) Settings.canDrawOverlays(this) else true

          /** هل صلاحية الملفات ممنوحة؟ أندرويد 11+ = الوصول لكل الملفات، أندرويد 10 = صلاحية التخزين العادية. */
          private fun storageOk(): Boolean {
              if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager()
              return checkSelfPermission(Manifest.permission.READ_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED &&
                  checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED
          }

          private fun reqStorage() {
              if (Build.VERSION.SDK_INT >= 30) {
                  try {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  } catch (e: Exception) {
                      startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
                  }
              } else {
                  requestPermissions(
                      arrayOf(
                          Manifest.permission.READ_EXTERNAL_STORAGE,
                          Manifest.permission.WRITE_EXTERNAL_STORAGE
                      ),
                      701
                  )
              }
          }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "a2r/share")
                      .setMethodCallHandler { call, result ->
                          try {
                              when (call.method) {
                                  "share" -> {
                                      val text = call.argument<String>("text") ?: ""
                                      val paths = call.argument<List<String>>("paths") ?: emptyList()
                                      val pkg = call.argument<String>("pkg") ?: ShareUtil.BUSINESS
                                      ShareUtil.send(this, text, paths, false, pkg)
                                      result.success(true)
                                  }
                                  "permStatus" -> {
                                      result.success(
                                          mapOf(
                                              "sdk" to Build.VERSION.SDK_INT,
                                              "storage" to storageOk(),
                                              "a11y" to a11yEnabled(),
                                              "overlay" to canOverlay()
                                          )
                                      )
                                  }
                                  "reqStorage" -> {
                                      reqStorage()
                                      result.success(true)
                                  }
                                  "svcStatus" -> {
                                      result.success(
                                          mapOf(
                                              "a11y" to a11yEnabled(),
                                              "live" to (BubbleService.inst != null),
                                              "overlay" to canOverlay()
                                          )
                                      )
                                  }
                                  "openA11y" -> {
                                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                                      result.success(true)
                                  }
                                  "openAppInfo" -> {
                                      startActivity(
                                          Intent(
                                              Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                              Uri.parse("package:$packageName")
                                          )
                                      )
                                      result.success(true)
                                  }
                                  "openOverlay" -> {
                                      startActivity(
                                          Intent(
                                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                              Uri.parse("package:$packageName")
                                          )
                                      )
                                      result.success(true)
                                  }
                                  "start" -> {
                                      val svc = BubbleService.inst
                                      if (svc == null) {
                                          result.error("NO_A11Y", "خدمة الفقاعة غير مفعّلة", null)
                                      } else {
                                          svc.startSession(
                                              call.argument<String>("session") ?: "",
                                              call.argument<Int>("at") ?: -1
                                          )
                                          result.success(true)
                                      }
                                  }
                                  "state" -> result.success(BubbleService.stateOf(this))
                                  "clear" -> {
                                      BubbleService.clearState(this)
                                      result.success(true)
                                  }
                                  "stop" -> {
                                      BubbleService.inst?.stopSession()
                                      result.success(true)
                                  }
                                  "setStatus" -> {
                                      BubbleService.inst?.setStatus(
                                          call.argument<Int>("i") ?: -1,
                                          call.argument<Int>("s") ?: 0
                                      )
                                      result.success(true)
                                  }
                                  "packList" -> {
                                      result.success(StickerPacks.listJson(this))
                                  }
                                  "buildPacks" -> {
                                      val paths = call.argument<List<String>>("paths") ?: emptyList()
                                      Thread {
                                          try {
                                              val j = StickerPacks.build(this, paths)
                                              runOnUiThread { result.success(j) }
                                          } catch (e: Exception) {
                                              runOnUiThread { result.error("PACK_FAILED", e.message, null) }
                                          }
                                      }.start()
                                  }
                                  "addPack" -> {
                                      StickerPacks.addToWhatsApp(
                                          this,
                                          call.argument<String>("id") ?: "",
                                          call.argument<String>("name") ?: "",
                                          call.argument<String>("pkg") ?: ShareUtil.BUSINESS
                                      )
                                      result.success(true)
                                  }
                                  else -> result.notImplemented()
                              }
                          } catch (e: ActivityNotFoundException) {
                              result.error("NO_WA_BUSINESS", "WhatsApp Business غير مثبت", null)
                          } catch (e: Exception) {
                              result.error("SHARE_FAILED", e.message, null)
                          }
                      }
              }
          }
          KT
          cat > $D/Sess.kt <<'KT'
          package com.a2r.a2r_academy_sender

          import org.json.JSONArray
          import org.json.JSONObject

          /** عنصر في الجلسة: st = 0 معلّق، 1 تم، 2 تخطي. launch = يفتح واتساب عند الوصول له. */
          class SItem(val title: String, val key: String, val launch: Boolean, var st: Int)

          class Sess(
              val id: String,
              val mode: String,
              val pkg: String,
              val text: String,
              val media: List<String>,
              val items: MutableList<SItem>,
              var idx: Int,
              var active: Boolean,
              /** وضع المصنف المفتوح: أسماء المحادثات التي فُتحت بالفعل حتى لا تتكرر. */
              val seen: MutableSet<String> = mutableSetOf(),
              /** وضع المصنف المفتوح: true عند الوصول لنهاية القائمة. */
              var lwDone: Boolean = false
          ) {
              fun toJson(): String {
                  val o = JSONObject()
                  o.put("id", id)
                  o.put("mode", mode)
                  o.put("pkg", pkg)
                  o.put("text", text)
                  o.put("media", JSONArray(media))
                  val a = JSONArray()
                  for (x in items) {
                      val j = JSONObject()
                      j.put("t", x.title)
                      j.put("k", x.key)
                      j.put("l", x.launch)
                      j.put("s", x.st)
                      a.put(j)
                  }
                  o.put("items", a)
                  o.put("idx", idx)
                  o.put("active", active)
                  if (seen.isNotEmpty()) o.put("seen", JSONArray(seen.toList()))
                  o.put("lwDone", lwDone)
                  return o.toString()
              }

              /** ما يحتاجه Flutter فقط: الحالات والمؤشر وهل الجلسة شغالة. */
              fun stateJson(): String {
                  val o = JSONObject()
                  o.put("id", id)
                  o.put("active", active)
                  o.put("idx", idx)
                  val a = JSONArray()
                  for (x in items) a.put(x.st)
                  o.put("st", a)
                  val tt = JSONArray()
                  for (x in items) tt.put(x.title)
                  o.put("tt", tt)
                  return o.toString()
              }

              companion object {
                  fun parse(s: String): Sess {
                      val o = JSONObject(s)
                      val media = ArrayList<String>()
                      val m = o.optJSONArray("media")
                      if (m != null) {
                          for (i in 0 until m.length()) media.add(m.getString(i))
                      }
                      val items = ArrayList<SItem>()
                      val a = o.getJSONArray("items")
                      for (i in 0 until a.length()) {
                          val j = a.getJSONObject(i)
                          items.add(
                              SItem(
                                  j.optString("t", ""),
                                  j.optString("k", ""),
                                  j.optBoolean("l", true),
                                  j.optInt("s", 0)
                              )
                          )
                      }
                      val rawPkg = o.optString("pkg", ShareUtil.BUSINESS)
                      val pkg = if (rawPkg == ShareUtil.NORMAL) ShareUtil.NORMAL else ShareUtil.BUSINESS
                      val seen = mutableSetOf<String>()
                      val sv = o.optJSONArray("seen")
                      if (sv != null) {
                          for (i in 0 until sv.length()) seen.add(sv.getString(i))
                      }
                      return Sess(
                          o.optString("id", "job"),
                          o.optString("mode", "review"),
                          pkg,
                          o.optString("text", ""),
                          media,
                          items,
                          o.optInt("idx", -1),
                          o.optBoolean("active", true),
                          seen,
                          o.optBoolean("lwDone", false)
                      )
                  }
              }
          }
          KT
          cat > $D/ShareUtil.kt <<'KT'
          package com.a2r.a2r_academy_sender

          import android.content.ActivityNotFoundException
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import androidx.core.content.FileProvider
          import java.io.File

          object ShareUtil {
              const val BUSINESS = "com.whatsapp.w4b"
              const val NORMAL = "com.whatsapp"

              private fun mimeOf(path: String): String {
                  val p = path.lowercase()
                  return when {
                      p.endsWith(".webp") -> "image/webp"
                      p.endsWith(".png") -> "image/png"
                      p.endsWith(".gif") -> "image/gif"
                      else -> "image/jpeg"
                  }
              }

              /** يفتح شاشة المشاركة في واتساب المحدد. newTask = true عند الاستدعاء من خدمة. */
              fun send(
                  ctx: Context,
                  text: String,
                  paths: List<String>,
                  newTask: Boolean,
                  pkg: String = BUSINESS
              ) {
                  val target = if (pkg == NORMAL) NORMAL else BUSINESS
                  val uris = ArrayList<Uri>()
                  for (p in paths) {
                      uris.add(FileProvider.getUriForFile(ctx, "${ctx.packageName}.fileprovider", File(p)))
                  }
                  val intent = Intent()
                  intent.setPackage(target)
                  when {
                      uris.isEmpty() -> {
                          intent.action = Intent.ACTION_SEND
                          intent.type = "text/plain"
                          intent.putExtra(Intent.EXTRA_TEXT, text)
                      }
                      uris.size == 1 -> {
                          intent.action = Intent.ACTION_SEND
                          intent.type = mimeOf(paths[0])
                          intent.putExtra(Intent.EXTRA_STREAM, uris[0])
                          if (text.isNotEmpty()) intent.putExtra(Intent.EXTRA_TEXT, text)
                      }
                      else -> {
                          intent.action = Intent.ACTION_SEND_MULTIPLE
                          intent.type = "image/*"
                          intent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, uris)
                          if (text.isNotEmpty()) intent.putExtra(Intent.EXTRA_TEXT, text)
                      }
                  }
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  if (newTask) intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  for (u in uris) ctx.grantUriPermission(target, u, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  ctx.startActivity(intent)
              }

              /** يفتح القائمة الرئيسية في واتساب المحدد للبحث والمراجعة قبل تجهيز الرسالة. */
              fun openMain(ctx: Context, pkg: String = BUSINESS) {
                  val target = if (pkg == NORMAL) NORMAL else BUSINESS
                  val intent = ctx.packageManager.getLaunchIntentForPackage(target)
                      ?: throw ActivityNotFoundException("واتساب غير مثبت")
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                  ctx.startActivity(intent)
              }
          }
          KT
          cat > $D/StickerPack.kt <<'KT'
          package com.a2r.a2r_academy_sender

          import android.app.Activity
          import android.content.ContentProvider
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.res.AssetFileDescriptor
          import android.database.Cursor
          import android.database.MatrixCursor
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.RectF
          import android.net.Uri
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream

          /** حزم الاستيكرات: تحويل webp 512x512 وتقسيم 30 لكل حزمة وإضافة لواتساب عبر الـ Sticker API الرسمي. */
          object StickerPacks {
              const val LIMIT = 30

              private fun root(ctx: Context) = File(ctx.filesDir, "stickerpacks")
              private fun jsonFile(ctx: Context) = File(root(ctx), "packs.json")

              fun listJson(ctx: Context): String =
                  try { jsonFile(ctx).readText() } catch (e: Exception) { "[]" }

              fun read(ctx: Context): JSONArray =
                  try { JSONArray(listJson(ctx)) } catch (e: Exception) { JSONArray() }

              /** يعيد بناء كل الحزم من مكتبة المستخدم. يرجع JSON بالحزم الناتجة. */
              fun build(ctx: Context, paths: List<String>): String {
                  val old = read(ctx)
                  val oldVer = HashMap<String, Int>()
                  for (i in 0 until old.length()) {
                      val o = old.getJSONObject(i)
                      oldVer[o.getString("id")] = o.optInt("version", 0)
                  }
                  root(ctx).deleteRecursively()
                  root(ctx).mkdirs()

                  val valid = paths.map { File(it) }.filter { it.exists() }
                  val chunks = mutableListOf<MutableList<File>>()
                  var cur = mutableListOf<File>()
                  for (f in valid) {
                      if (cur.size == LIMIT) { chunks.add(cur); cur = mutableListOf() }
                      cur.add(f)
                  }
                  if (cur.isNotEmpty()) chunks.add(cur)
                  // واتساب يشترط 3 استيكرات على الأقل في الحزمة: اسحب من السابقة عند الحاجة
                  while (chunks.size > 1 && chunks.last().size < 3) {
                      val prev = chunks[chunks.size - 2]
                      if (prev.size <= 3) break
                      chunks.last().add(0, prev.removeAt(prev.size - 1))
                  }

                  val out = JSONArray()
                  var packIdx = 0
                  for (chunk in chunks) {
                      packIdx++
                      val id = "a2r_$packIdx"
                      val packDir = File(root(ctx), id)
                      packDir.mkdirs()
                      val stickers = JSONArray()
                      var first: File? = null
                      var count = 0
                      for (f in chunk) {
                          val dest = File(packDir, "s%03d.webp".format(count + 1))
                          try {
                              convert(f, dest, 512, 100)
                          } catch (e: Exception) {
                              continue
                          }
                          if (first == null) first = dest
                          val so = JSONObject()
                          so.put("f", dest.name)
                          so.put("e", "\uD83D\uDE42")
                          stickers.put(so)
                          count++
                      }
                      if (count == 0) { packIdx--; packDir.deleteRecursively(); continue }
                      if (first != null) convert(first, File(packDir, "tray.webp"), 96, 50)
                      val o = JSONObject()
                      o.put("id", id)
                      o.put("name", "A2R $packIdx")
                      o.put("publisher", "A2R")
                      o.put("tray", "tray.webp")
                      o.put("version", (oldVer[id] ?: 0) + 1)
                      o.put("count", count)
                      o.put("stickers", stickers)
                      out.put(o)
                  }
                  jsonFile(ctx).writeText(out.toString())
                  return out.toString()
              }

              /** تحويل صورة إلى webp بمقاس مربع مع شفافية وحد أقصى للحجم. الملصق المتحرك يتحول لإطار ثابت. */
              private fun convert(src: File, dest: File, size: Int, maxKb: Int) {
                  val bounds = BitmapFactory.Options()
                  bounds.inJustDecodeBounds = true
                  BitmapFactory.decodeFile(src.absolutePath, bounds)
                  if (bounds.outWidth <= 0 || bounds.outHeight <= 0) throw Exception("صورة غير صالحة")
                  var sample = 1
                  while (bounds.outWidth / (sample * 2) >= size && bounds.outHeight / (sample * 2) >= size) sample *= 2
                  val opts = BitmapFactory.Options()
                  opts.inSampleSize = sample
                  val bmp = BitmapFactory.decodeFile(src.absolutePath, opts)
                      ?: throw Exception("تعذر فك الصورة")
                  val scaled = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888)
                  val c = Canvas(scaled)
                  val ratio = minOf(size.toFloat() / bmp.width, size.toFloat() / bmp.height)
                  val w = (bmp.width * ratio).toInt()
                  val hh = (bmp.height * ratio).toInt()
                  val left = (size - w) / 2f
                  val top = (size - hh) / 2f
                  c.drawBitmap(bmp, null, RectF(left, top, left + w, top + hh), null)
                  val format = if (Build.VERSION.SDK_INT >= 30)
                      Bitmap.CompressFormat.WEBP_LOSSY else Bitmap.CompressFormat.WEBP
                  var q = 90
                  while (true) {
                      val fos = FileOutputStream(dest)
                      scaled.compress(format, q, fos)
                      fos.close()
                      if (dest.length() <= maxKb * 1024L || q <= 40) break
                      q -= 15
                  }
                  bmp.recycle()
                  scaled.recycle()
              }

              /** يفتح حوار واتساب الرسمي لإضافة الحزمة. */
              fun addToWhatsApp(activity: Activity, id: String, name: String, pkg: String) {
                  val intent = Intent("com.whatsapp.intent.action.ENABLE_STICKER_PACK")
                  intent.putExtra("sticker_pack_id", id)
                  intent.putExtra("sticker_pack_authority",
                      activity.packageName + ".stickercontentprovider")
                  intent.putExtra("sticker_pack_name", name)
                  intent.setPackage(if (pkg == ShareUtil.NORMAL) ShareUtil.NORMAL else ShareUtil.BUSINESS)
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  activity.startActivity(intent)
              }

              private val MD_COLS = arrayOf(
                  "sticker_pack_identifier", "sticker_pack_name", "sticker_pack_publisher",
                  "sticker_pack_icon", "android_play_store_link", "ios_app_download_link_in_query",
                  "publisher_email", "publisher_website", "privacy_policy_website",
                  "license_agreement_website", "image_data_version", "avoid_cache",
                  "animated_sticker_pack"
              )

              fun metadataCursor(packs: JSONArray, id: String?): Cursor {
                  val c = MatrixCursor(MD_COLS)
                  for (i in 0 until packs.length()) {
                      val o = packs.getJSONObject(i)
                      if (id != null && o.getString("id") != id) continue
                      c.addRow(arrayOf(
                          o.getString("id"), o.getString("name"), o.getString("publisher"),
                          o.getString("tray"), "", "", "", "", "", "",
                          o.optInt("version", 1), 0, 0
                      ))
                  }
                  return c
              }

              fun stickersCursor(packs: JSONArray, id: String?): Cursor {
                  val c = MatrixCursor(arrayOf("sticker_file_name", "sticker_emoji"))
                  for (i in 0 until packs.length()) {
                      val o = packs.getJSONObject(i)
                      if (o.getString("id") != id) continue
                      val st = o.getJSONArray("stickers")
                      for (j in 0 until st.length()) {
                          val so = st.getJSONObject(j)
                          c.addRow(arrayOf(so.getString("f"), so.optString("e", "\uD83D\uDE42")))
                      }
                  }
                  return c
              }
          }

          /** مزوّد محتوى الحزم الذي يقرأه واتساب (مسارات /metadata و /stickers و /stickers_asset). */
          class StickerPackProvider : ContentProvider() {
              override fun onCreate(): Boolean = true

              override fun query(
                  uri: Uri,
                  projection: Array<out String>?,
                  selection: String?,
                  selectionArgs: Array<out String>?,
                  sortOrder: String?
              ): Cursor {
                  val packs = StickerPacks.read(context!!)
                  val path = uri.path ?: ""
                  return when {
                      path == "/metadata" -> StickerPacks.metadataCursor(packs, null)
                      path.startsWith("/metadata/") ->
                          StickerPacks.metadataCursor(packs, uri.lastPathSegment)
                      path.startsWith("/stickers/") ->
                          StickerPacks.stickersCursor(packs, uri.lastPathSegment)
                      else -> throw IllegalArgumentException("مسار غير معروف: " + uri)
                  }
              }

              override fun getType(uri: Uri): String? = null

              override fun openAssetFile(uri: Uri, mode: String): AssetFileDescriptor? {
                  val segs = uri.pathSegments
                  if (segs.size == 3 && segs[0] == "stickers_asset") {
                      val f = File(context!!.filesDir, "stickerpacks/" + segs[1] + "/" + segs[2])
                      if (f.exists()) {
                          val pfd = ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY)
                          return AssetFileDescriptor(pfd, 0, f.length())
                      }
                  }
                  return null
              }

              override fun insert(uri: Uri, values: ContentValues?): Uri? = null
              override fun delete(uri: Uri, selection: String?, selectionArgs: Array<out String>?): Int = 0
              override fun update(uri: Uri, values: ContentValues?, selection: String?, selectionArgs: Array<out String>?): Int = 0
          }
          KT
          cat > $D/BubbleService.kt <<'KT'
          package com.a2r.a2r_academy_sender

          import android.accessibilityservice.AccessibilityService
          import android.content.ActivityNotFoundException
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.TextUtils
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView

          /**
           * خدمة إمكانية الوصول (مقصورة على واتساب / واتساب بيزنس) + الشريط العائم.
           * تعتمد على الاستجابة الفورية لتغيرات الشاشة (onAccessibilityEvent) مع مؤقت احتياطي
           * لسرعة وثبات أعلى في البحث وتجهيز الرسالة.
           */
          class BubbleService : AccessibilityService() {

              companion object {
                  @Volatile
                  var inst: BubbleService? = null
                  const val PREFS = "a2r_bubble"

                  fun stateOf(ctx: Context): String? {
                      val s = inst?.sess
                      if (s != null) return s.stateJson()
                      val saved = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                          .getString("sess", null) ?: return null
                      return try {
                          val p = Sess.parse(saved)
                          p.active = false
                          p.stateJson()
                      } catch (e: Exception) {
                          null
                      }
                  }

                  fun clearState(ctx: Context) {
                      val svc = inst
                      if (svc != null && svc.sess?.active != true) svc.sess = null
                      ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().remove("sess").apply()
                  }
              }

              private val h = Handler(Looper.getMainLooper())
              private var wm: WindowManager? = null
              internal var sess: Sess? = null

              private var bubble: LinearLayout? = null
              private var bubbleLp: WindowManager.LayoutParams? = null
              private var tv1: TextView? = null
              private var tv2: TextView? = null
              private var btnPrep: TextView? = null
              private var btnNext: TextView? = null
              private var scrim: View? = null

              private var token = 0
              private var noteText: String? = null
              private var lastAdvance = 0L
              private var lastPrepare = 0L
              private var lwToken = 0

              // حالة البحث النشط (تُغذّى فورياً من onAccessibilityEvent + مؤقت احتياطي)
              private var pActive = false
              private var pToken = 0
              private var pKey = ""
              private var pMode = "review"
              private var pAttempt = 0
              private var pClicked = false
              private var pBacks = 0
              private var pLastStep = 0L
              private var pRunnable: Runnable? = null

              private var downX = 0f
              private var downY = 0f
              private var startX = 0
              private var startY = 0
              private var moved = false
              private var longFired = false
              private val longRun = Runnable {
                  longFired = true
                  showPanel()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun targetPkg(): String = sess?.pkg ?: ShareUtil.BUSINESS

              // ---------------------------------------------------------------- دورة حياة الخدمة

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!pActive) return
                  val pkg = event?.packageName?.toString() ?: return
                  if (pkg != targetPkg()) return
                  val now = System.currentTimeMillis()
                  if (now - pLastStep < 180L) return
                  h.post { stepSearch(pToken, true) }
              }

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  hideAll()
                  inst = null
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  hideAll()
                  inst = null
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- الجلسة

              private fun save() {
                  val s = sess ?: return
                  getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("sess", s.toJson()).apply()
              }

              private fun cancelSearch() {
                  pActive = false
                  pRunnable?.let { h.removeCallbacks(it) }
                  pRunnable = null
                  token++
              }

              /** يبدأ الجلسة ويفتح العنصر at (أو أول معلّق) فوراً. */
              fun startSession(json: String, at: Int) {
                  val s = Sess.parse(json)
                  s.active = true
                  sess = s
                  if (s.mode == "listwalk") {
                      s.lwDone = false
                      s.idx = if (s.items.isEmpty()) -1 else s.items.indexOfFirst { x -> x.st == 0 }
                      noteText = null
                      save()
                      hideAll()
                      showBubble()
                      note("افتح المصنف في واتساب ثم اضغط التالي ◀")
                      return
                  }
                  var i = at
                  if (i < 0 || i >= s.items.size) i = s.items.indexOfFirst { x -> x.st == 0 }
                  s.idx = i
                  noteText = null
                  save()
                  hideAll()
                  showBubble()
                  if (i >= 0) openCurrent(true) else render()
              }

              fun stopSession() {
                  val s = sess
                  if (s != null) {
                      s.active = false
                      save()
                  }
                  hideAll()
              }

              fun setStatus(i: Int, st: Int) {
                  val s = sess ?: return
                  val x = s.items.getOrNull(i) ?: return
                  x.st = st
                  save()
                  render()
              }

              /** يعلّم الحالي (تم/تخطي) ثم ينتقل لأول معلّق. */
              private fun advance(st: Int) {
                  val s = sess ?: return
                  val now = System.currentTimeMillis()
                  if (now - lastAdvance < 550) return
                  lastAdvance = now
                  if (s.mode == "listwalk") {
                      listwalkAdvance(s, st)
                      return
                  }
                  if (s.idx < 0 || s.idx >= s.items.size) {
                      stopSession()
                      return
                  }
                  val cur = s.items.getOrNull(s.idx)
                  if (cur != null && cur.st == 0) cur.st = st
                  s.idx = s.items.indexOfFirst { x -> x.st == 0 }
                  noteText = null
                  save()
                  if (s.idx < 0) {
                      cancelSearch()
                      render()
                  } else {
                      openCurrent(false)
                  }
              }

              /** وضع المصنف المفتوح: يعلّم الحالية، يرجع من المحادثة للقائمة، ويفتح أول محادثة لم تُفتح. */
              private fun listwalkAdvance(s: Sess, st: Int) {
                  if (s.lwDone) {
                      stopSession()
                      return
                  }
                  val cur = s.items.getOrNull(s.idx)
                  if (cur != null && cur.st == 0) {
                      cur.st = st
                      save()
                  }
                  val root = rootInActiveWindow
                  if (root != null && root.packageName?.toString() == targetPkg() && findChatInput(root) != null) {
                      performGlobalAction(GLOBAL_ACTION_BACK)
                  }
                  noteText = null
                  lwToken++
                  val my = lwToken
                  h.postDelayed({ lwStep(s, my, 0) }, 600)
              }

              /** يفتح أول محادثة ظاهرة في قائمة المصنف لم تُفتح بعد، مع التمرير للأسفل عند الحاجة. */
              private fun lwStep(s: Sess, my: Int, scrolls: Int) {
                  if (my != lwToken) return
                  if (sess !== s || !s.active) return
                  val root = rootInActiveWindow
                  if (root == null || root.packageName?.toString() != targetPkg()) {
                      note("افتح واتساب والمصنف الأول")
                      return
                  }
                  val rows = collectRows(root)
                  for (row in rows) {
                      val name = rowName(row)
                      if (name.isNotEmpty() && !s.seen.contains(name)) {
                          s.seen.add(name)
                          s.items.add(SItem(name, name, false, 0))
                          s.idx = s.items.size - 1
                          save()
                          clickNode(row)
                          note("فتحت: " + name)
                          render()
                          return
                      }
                  }
                  if (scrolls < 30 && scrollListForward(root)) {
                      h.postDelayed({ lwStep(s, my, scrolls + 1) }, 450)
                  } else {
                      s.lwDone = true
                      save()
                      note("اكتملت القائمة ✓")
                      render()
                  }
              }

              /** صفوف المحادثات الظاهرة في القائمة، مرتبة من الأعلى للأسفل. */
              private fun collectRows(root: AccessibilityNodeInfo): List<AccessibilityNodeInfo> {
                  val out = ArrayList<AccessibilityNodeInfo>()
                  fun walk(n: AccessibilityNodeInfo?, depth: Int) {
                      if (n == null || depth > 40) return
                      val id = n.viewIdResourceName ?: ""
                      if (n.isVisibleToUser && id.contains("conversations_row", true)) {
                          out.add(n)
                          return
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i), depth + 1)
                  }
                  walk(root, 0)
                  if (out.isEmpty()) {
                      // احتياطي: عناصر قابلة للضغط لها وصف داخل قائمة قابلة للتمرير
                      fun walk2(n: AccessibilityNodeInfo?, depth: Int, inList: Boolean) {
                          if (n == null || depth > 40) return
                          val cls = n.className?.toString() ?: ""
                          val list = inList || cls.contains("RecyclerView") || cls.contains("ListView")
                          if (list && n.isVisibleToUser && n.isClickable && !n.contentDescription.isNullOrEmpty()) {
                              out.add(n)
                              return
                          }
                          for (i in 0 until n.childCount) walk2(n.getChild(i), depth + 1, list)
                      }
                      walk2(root, 0, false)
                  }
                  return out.sortedBy {
                      val b = android.graphics.Rect()
                      it.getBoundsInScreen(b)
                      b.top * 10000 + b.left
                  }
              }

              /** اسم المحادثة من صف القائمة: أول جزء من الوصف قبل آخر رسالة/الوقت. */
              private fun rowName(n: AccessibilityNodeInfo): String {
                  val d = n.contentDescription?.toString() ?: ""
                  if (d.isNotEmpty()) return d.substringBefore(',').substringBefore('\n').trim()
                  fun firstText(x: AccessibilityNodeInfo?, depth: Int): String {
                      if (x == null || depth > 12) return ""
                      val t = x.text?.toString() ?: ""
                      if (t.isNotEmpty()) return t
                      for (i in 0 until x.childCount) {
                          val r = firstText(x.getChild(i), depth + 1)
                          if (r.isNotEmpty()) return r
                      }
                      return ""
                  }
                  return firstText(n, 0).substringBefore('\n').trim()
              }

              /** يمرر قائمة المحادثات للأسفل خطوة. يرجع false عند نهاية القائمة. */
              private fun scrollListForward(root: AccessibilityNodeInfo): Boolean {
                  var target: AccessibilityNodeInfo? = null
                  fun walk(n: AccessibilityNodeInfo?, depth: Int) {
                      if (n == null || depth > 40 || target != null) return
                      val cls = n.className?.toString() ?: ""
                      if (n.isVisibleToUser && (cls.contains("RecyclerView") || cls.contains("ListView")) && n.isScrollable) {
                          target = n
                          return
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i), depth + 1)
                  }
                  walk(root, 0)
                  val t = target ?: return false
                  return t.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
              }

              /** يفتح واتساب حسب الوضع (مراجعة في الرئيسية أو مشاركة مباشرة) ثم يبدأ البحث الفوري. */
              private fun openCurrent(force: Boolean) {
                  val s = sess ?: return
                  val item = s.items.getOrNull(s.idx)
                  if (item == null) {
                      render()
                      return
                  }
                  noteText = null
                  render()
                  cancelSearch()
                  val pkg = s.pkg
                  if (s.mode == "review") {
                      var delay = 150L
                      val curPkg = rootInActiveWindow?.packageName?.toString()
                      if (force || curPkg != pkg) {
                          try {
                              ShareUtil.openMain(this, pkg)
                              delay = 650L
                          } catch (e: ActivityNotFoundException) {
                              note("واتساب غير مثبت")
                              return
                          } catch (e: Exception) {
                              note("تعذر فتح واتساب")
                              return
                          }
                      }
                      beginSearch(item.key, "review", delay)
                  } else {
                      var delay = 150L
                      if (item.launch || force) {
                          try {
                              ShareUtil.send(this, s.text, s.media, true, pkg)
                              delay = 800L
                          } catch (e: ActivityNotFoundException) {
                              note("واتساب غير مثبت")
                              return
                          } catch (e: Exception) {
                              note("تعذر فتح واتساب")
                              return
                          }
                      }
                      beginSearch(item.key, "share", delay)
                  }
              }

              /** زر تجهيز الرسالة بعد التأكد من الجروب في وضع المراجعة. */
              private fun prepareMessage() {
                  val s = sess ?: return
                  val item = s.items.getOrNull(s.idx) ?: return
                  val now = System.currentTimeMillis()
                  if (now - lastPrepare < 550) return
                  lastPrepare = now
                  cancelSearch()

                  if (s.media.isEmpty()) {
                      val root = rootInActiveWindow
                      if (root != null && root.packageName?.toString() == s.pkg) {
                          val input = findChatInput(root)
                          if (input != null) {
                              val args = Bundle()
                              args.putCharSequence(
                                  AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                                  s.text
                              )
                              input.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                              if (input.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                                  note("✓ جاهزة — اضغط إرسال")
                                  return
                              }
                          }
                      }
                      copyClip(s.text)
                      note("افتح المحادثة أولاً (النص منسوخ)")
                  } else {
                      try {
                          ShareUtil.send(this, s.text, s.media, true, s.pkg)
                          note("جاري فتح المشاركة...")
                          beginSearch(item.key, "share", 750L)
                      } catch (e: ActivityNotFoundException) {
                          note("واتساب غير مثبت")
                      } catch (e: Exception) {
                          note("تعذر فتح المشاركة")
                      }
                  }
              }

              /** إعادة كتابة كلمة البحث بدون إعادة فتح واتساب. */
              private fun retype() {
                  val s = sess ?: return
                  val item = s.items.getOrNull(s.idx) ?: return
                  cancelSearch()
                  beginSearch(item.key, s.mode, 100L)
              }

              // ---------------------------------------------------------------- محرك البحث السريع (Event-Driven + Fallback)

              private fun beginSearch(key: String, mode: String, initialDelay: Long) {
                  token++
                  pToken = token
                  pKey = key
                  pMode = mode
                  pAttempt = 0
                  pClicked = false
                  pBacks = 0
                  pLastStep = 0L
                  pActive = true
                  scheduleStep(pToken, initialDelay)
              }

              private fun scheduleStep(my: Int, delayMs: Long) {
                  pRunnable?.let { h.removeCallbacks(it) }
                  val r = Runnable { stepSearch(my, false) }
                  pRunnable = r
                  h.postDelayed(r, delayMs)
              }

              private fun stepSearch(my: Int, fromEvent: Boolean) {
                  if (!pActive || my != pToken) return
                  val pkg = targetPkg()
                  val maxAttempts = if (pMode == "review") 24 else 22
                  if (pAttempt > maxAttempts) {
                      pActive = false
                      copyClip(pKey)
                      note("لم أجد البحث — الرقم منسوخ")
                      return
                  }
                  pLastStep = System.currentTimeMillis()
                  if (!fromEvent) pAttempt++

                  val root = rootInActiveWindow
                  if (root != null && root.packageName?.toString() == pkg) {
                      if (pMode == "review") {
                          val f = findSearchField(root, false)
                          if (f != null) {
                              val args = Bundle()
                              args.putCharSequence(
                                  AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                                  pKey
                              )
                              f.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                              if (f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                                  pActive = false
                                  note("✓ افتح الجروب للتأكد ثم اضغط تجهيز")
                                  return
                              }
                          } else {
                              val inChat = findChatInput(root) != null
                              if (inChat && pBacks < 3) {
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  pBacks++
                                  pClicked = false
                                  scheduleStep(my, 420L)
                                  return
                              }
                              val b = findSearchButton(root)
                              if (b != null && (!pClicked || pAttempt % 4 == 3)) {
                                  if (clickNode(b)) pClicked = true
                              } else if (b == null && pAttempt >= 2 && pAttempt % 3 == 2 && pBacks < 3) {
                                  performGlobalAction(GLOBAL_ACTION_BACK)
                                  pBacks++
                                  pClicked = false
                                  scheduleStep(my, 420L)
                                  return
                              }
                          }
                      } else {
                          val f = findSearchField(root, pAttempt >= 8)
                          if (f != null) {
                              val args = Bundle()
                              args.putCharSequence(
                                  AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE,
                                  pKey
                              )
                              f.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                              if (f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                                  pActive = false
                                  note("✓ كُتب في البحث")
                                  return
                              }
                          } else if (!pClicked || pAttempt % 5 == 4) {
                              val b = findSearchButton(root)
                              if (b != null && clickNode(b)) pClicked = true
                          }
                      }
                  }
                  scheduleStep(my, 320L)
              }

              // ---------------------------------------------------------------- أدوات التعرف على الحقول

              private fun isChatEntry(n: AccessibilityNodeInfo): Boolean {
                  val id = n.viewIdResourceName ?: ""
                  if (id.contains("entry", true)) return true
                  val hint = if (Build.VERSION.SDK_INT >= 26) (n.hintText?.toString() ?: "") else ""
                  val desc = hint + " " + (n.contentDescription?.toString() ?: "")
                  return desc.contains("مراسلة") || desc.contains("رسالة") || desc.contains("Message", true)
              }

              private fun isSearchNode(n: AccessibilityNodeInfo): Boolean {
                  val id = n.viewIdResourceName ?: ""
                  val hint = if (Build.VERSION.SDK_INT >= 26) (n.hintText?.toString() ?: "") else ""
                  val desc = hint + " " + (n.contentDescription?.toString() ?: "")
                  return id.contains("search", true) || desc.contains("بحث") || desc.contains("search", true)
              }

              private fun findSearchField(root: AccessibilityNodeInfo, allowAny: Boolean): AccessibilityNodeInfo? {
                  var best: AccessibilityNodeInfo? = null
                  var any: AccessibilityNodeInfo? = null
                  fun walk(n: AccessibilityNodeInfo?, depth: Int) {
                      if (n == null || depth > 40) return
                      if (n.className?.toString() == "android.widget.EditText" && n.isVisibleToUser) {
                          if (!isChatEntry(n)) {
                              if (isSearchNode(n)) {
                                  if (best == null) best = n
                              }
                              if (any == null) any = n
                          }
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i), depth + 1)
                  }
                  walk(root, 0)
                  return best ?: (if (allowAny) any else null)
              }

              private fun findChatInput(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  var best: AccessibilityNodeInfo? = null
                  var any: AccessibilityNodeInfo? = null
                  fun walk(n: AccessibilityNodeInfo?, depth: Int) {
                      if (n == null || depth > 40) return
                      if (n.className?.toString() == "android.widget.EditText" && n.isVisibleToUser) {
                          if (isChatEntry(n)) {
                              if (best == null) best = n
                          } else if (!isSearchNode(n)) {
                              if (any == null) any = n
                          }
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i), depth + 1)
                  }
                  walk(root, 0)
                  return best ?: any
              }

              private fun findSearchButton(root: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  var found: AccessibilityNodeInfo? = null
                  fun walk(n: AccessibilityNodeInfo?, depth: Int) {
                      if (n == null || depth > 40 || found != null) return
                      if (n.className?.toString() != "android.widget.EditText" && n.isVisibleToUser) {
                          val id = n.viewIdResourceName ?: ""
                          val d = n.contentDescription?.toString() ?: ""
                          if (id.contains("search", true) || d.contains("بحث") || d.contains("search", true)) {
                              found = n
                              return
                          }
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i), depth + 1)
                  }
                  walk(root, 0)
                  return found
              }

              private fun clickNode(n: AccessibilityNodeInfo): Boolean {
                  var c: AccessibilityNodeInfo? = n
                  var guard = 0
                  while (c != null && guard < 8) {
                      if (c.isClickable) return c.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      c = c.parent
                      guard++
                  }
                  return false
              }

              private fun copyClip(t: String) {
                  try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("a2r", t))
                  } catch (e: Exception) {
                  }
              }

              // ---------------------------------------------------------------- الشريط العائم

              private fun note(msg: String) {
                  noteText = msg
                  render()
                  h.postDelayed({
                      if (noteText == msg) {
                          noteText = null
                          render()
                      }
                  }, 5000)
              }

              private fun render() {
                  val a = tv1 ?: return
                  val b = tv2 ?: return
                  val s = sess ?: return
                  if (s.mode == "listwalk") {
                      val doneLw = s.items.count { x -> x.st != 0 }
                      if (s.lwDone) {
                          a.text = "اكتمل ✓ ($doneLw محادثة)"
                          b.text = "اضغط إغلاق"
                          btnPrep?.visibility = View.GONE
                          btnNext?.text = "إغلاق ✓"
                      } else if (s.idx < 0 || s.idx >= s.items.size) {
                          a.text = "المصنف المفتوح ($doneLw)"
                          b.text = noteText ?: "اضغط التالي بعد فتح المصنف"
                          btnPrep?.visibility = View.GONE
                          btnNext?.text = "التالي ◀"
                      } else {
                          val cur = s.items[s.idx]
                          a.text = "${s.idx + 1}  •  ${cur.title}"
                          b.text = noteText ?: "راجع المحادثة ثم اضغط تجهيز"
                          btnPrep?.visibility = View.VISIBLE
                          btnNext?.text = "التالي ◀"
                      }
                      return
                  }
                  val total = s.items.size
                  val done = s.items.count { x -> x.st != 0 }
                  if (s.idx < 0 || s.idx >= total) {
                      a.text = "اكتمل ✓ ($done/$total)"
                      b.text = "اضغط إغلاق"
                      btnPrep?.visibility = View.GONE
                      btnNext?.text = "إغلاق ✓"
                  } else {
                      val cur = s.items[s.idx]
                      a.text = "${s.idx + 1}/$total  •  ${cur.key}"
                      b.text = noteText ?: cur.title
                      btnPrep?.visibility = if (s.mode == "review") View.VISIBLE else View.GONE
                      btnNext?.text = "التالي ◀"
                  }
              }

              private fun prefs() = getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              private fun makeMiniBtn(label: String, bgHex: String, onClick: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 12f
                  t.setTextColor(Color.WHITE)
                  t.typeface = Typeface.DEFAULT_BOLD
                  t.gravity = Gravity.CENTER
                  t.setPadding(dp(10), dp(6), dp(10), dp(6))
                  val bg = GradientDrawable()
                  bg.setColor(Color.parseColor(bgHex))
                  bg.cornerRadius = dp(12).toFloat()
                  t.background = bg
                  t.setOnClickListener { onClick() }
                  return t
              }

              private fun showBubble() {
                  if (bubble != null) {
                      render()
                      return
                  }
                  val w = wm ?: return
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER
                  root.setPadding(dp(10), dp(7), dp(10), dp(8))
                  val bg = GradientDrawable()
                  bg.setColor(Color.parseColor("#F2134E3A"))
                  bg.cornerRadius = dp(18).toFloat()
                  root.background = bg

                  val header = LinearLayout(this)
                  header.orientation = LinearLayout.VERTICAL
                  header.gravity = Gravity.CENTER
                  header.setPadding(dp(4), dp(2), dp(4), dp(5))

                  val a = TextView(this)
                  a.setTextColor(Color.WHITE)
                  a.textSize = 13f
                  a.typeface = Typeface.DEFAULT_BOLD
                  a.maxLines = 1
                  a.ellipsize = TextUtils.TruncateAt.END
                  a.maxWidth = dp(200)
                  a.gravity = Gravity.CENTER

                  val b = TextView(this)
                  b.setTextColor(Color.parseColor("#D9FFFFFF"))
                  b.textSize = 10.5f
                  b.maxLines = 1
                  b.ellipsize = TextUtils.TruncateAt.END
                  b.maxWidth = dp(200)
                  b.gravity = Gravity.CENTER

                  header.addView(a)
                  header.addView(b)
                  header.setOnTouchListener { _, e -> onDragTouch(root, e) }
                  root.addView(header)

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER

                  val prep = makeMiniBtn("تجهيز", "#D97706") { prepareMessage() }
                  val next = makeMiniBtn("التالي ◀", "#1B7F5C") { advance(1) }
                  val menu = makeMiniBtn("⋮", "#33FFFFFF") { showPanel() }

                  val lpBtn = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  lpBtn.marginEnd = dp(6)
                  prep.layoutParams = lpBtn

                  val lpNext = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.WRAP_CONTENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  )
                  lpNext.marginEnd = dp(6)
                  next.layoutParams = lpNext

                  row.addView(prep)
                  row.addView(next)
                  row.addView(menu)
                  root.addView(row)

                  tv1 = a
                  tv2 = b
                  btnPrep = prep
                  btnNext = next

                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.LEFT
                  val dm = resources.displayMetrics
                  lp.x = prefs().getInt("bx", (dm.widthPixels * 0.40f).toInt())
                  lp.y = prefs().getInt("by", (dm.heightPixels * 0.18f).toInt())
                  try {
                      w.addView(root, lp)
                  } catch (e: Exception) {
                      tv1 = null
                      tv2 = null
                      btnPrep = null
                      btnNext = null
                      return
                  }
                  bubble = root
                  bubbleLp = lp
                  render()
              }

              private fun onDragTouch(v: View, e: MotionEvent): Boolean {
                  val lp = bubbleLp ?: return false
                  val dm = resources.displayMetrics
                  when (e.action) {
                      MotionEvent.ACTION_DOWN -> {
                          startX = lp.x
                          startY = lp.y
                          downX = e.rawX
                          downY = e.rawY
                          moved = false
                          longFired = false
                          h.postDelayed(longRun, 550)
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = e.rawX - downX
                          val dy = e.rawY - downY
                          val slop = ViewConfiguration.get(this).scaledTouchSlop
                          if (!moved && (Math.abs(dx) > slop || Math.abs(dy) > slop)) {
                              moved = true
                              h.removeCallbacks(longRun)
                          }
                          if (moved) {
                              val maxX = (dm.widthPixels - v.width).coerceAtLeast(0)
                              val maxY = (dm.heightPixels - v.height).coerceAtLeast(0)
                              lp.x = (startX + dx.toInt()).coerceIn(0, maxX)
                              lp.y = (startY + dy.toInt()).coerceIn(0, maxY)
                              try {
                                  wm?.updateViewLayout(v, lp)
                              } catch (ex: Exception) {
                              }
                          }
                          return true
                      }
                      MotionEvent.ACTION_UP -> {
                          h.removeCallbacks(longRun)
                          if (moved) {
                              prefs().edit().putInt("bx", lp.x).putInt("by", lp.y).apply()
                          }
                          return true
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          h.removeCallbacks(longRun)
                          return true
                      }
                  }
                  return false
              }

